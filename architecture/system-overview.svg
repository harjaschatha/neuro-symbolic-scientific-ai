<rect x="75" y="78" width="850" height="86" rx="12" fill="#1e3048" stroke="#639dda"/>
<text x="500" y="111" fill="#ffffff" font-size="21">Synthetic bioprocess trajectories</text>
<text x="500" y="140" fill="#c3d5e8" font-size="16">Multivariate inputs with known generating mechanisms</text>
<path d="M500 166 v19 m-6 -6 l6 6 6 -6" fill="none" stroke="#91b9df" stroke-width="2"/>
<rect x="75" y="193" width="850" height="86" rx="12" fill="#1e3048" stroke="#639dda"/>
<text x="500" y="226" fill="#ffffff" font-size="21">Residual evidence and biological diagnostics</text>

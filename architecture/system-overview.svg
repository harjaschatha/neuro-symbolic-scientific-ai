<text x="500" y="456" fill="#ffffff" font-size="21">Mechanistic fitting and guarded selection</text>
<text x="500" y="485" fill="#c3d5e8" font-size="16">Candidate ranking, constraints, and deterministic overrides</text>
<path d="M500 511 v19 m-6 -6 l6 6 6 -6" fill="none" stroke="#91b9df" stroke-width="2"/>
<rect x="75" y="538" width="850" height="86" rx="12" fill="#1e3048" stroke="#639dda"/>
<text x="500" y="571" fill="#ffffff" font-size="21">Saved decisions and evaluation</text>
